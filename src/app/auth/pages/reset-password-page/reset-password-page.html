<!-- ================================= -->
<!-- RESET PASSWORD - SPAFEU -->
<!-- ================================= -->

<main class="relative min-h-screen overflow-hidden bg-slate-950">

    <!-- ================================= -->
    <!-- BACKGROUND -->
    <!-- ================================= -->

    <div class="absolute inset-0">

        <!-- Background image -->
        <img src="/login-bg.jpg" alt="Background" class="h-full w-full object-cover opacity-20" />

        <!-- Overlay -->
        <div class="absolute inset-0 bg-linear-to-br from-slate-950/95 via-violet-950/90 to-sky-950/90"></div>

        <!-- Glow -->
        <div class="absolute -top-30 -left-25 h-112.5 w-112.5 rounded-full bg-sky-500/20 blur-3xl"></div>

        <div class="absolute -bottom-30 -right-25 h-125 w-125 rounded-full bg-cyan-400/20 blur-3xl"></div>

    </div>

    <!-- ================================= -->
    <!-- CONTENT -->
    <!-- ================================= -->

    <div class="relative z-10 flex min-h-screen items-center justify-center px-4 py-10 sm:px-6 lg:px-8">

        <!-- ================================= -->
        <!-- CARD -->
        <!-- ================================= -->

        <div
            class="relative w-full max-w-xl overflow-hidden rounded-[40px] border border-white/10 bg-white/10 p-8 shadow-2xl backdrop-blur-2xl sm:p-10 lg:p-12">

            <!-- Internal glow -->
            <div class="absolute inset-0 bg-linear-to-br from-white/10 via-transparent to-sky-500/10"></div>

            <!-- CONTENT -->
            <div class="relative z-10">

                <!-- Logo -->
                <div class="flex justify-center">

                    <div class="shadow-2xl backdrop-blur-xl">

                    </div>

                </div>



                <!-- Title -->
                <div class="mt-8 text-center">

                    <h1 class="text-4xl font-black tracking-tight text-white sm:text-5xl">

                        Nueva contraseña

                    </h1>

                    <p class="mx-auto mt-5 max-w-md text-lg leading-relaxed text-slate-300">

                        Crea una nueva contraseña segura para recuperar el acceso a tu cuenta SPAFEU.

                    </p>

                </div>

                <!-- FORM -->
                <form class="mt-10 space-y-6">

                    <!-- Password -->
                    <div>

                        <label class="mb-3 block text-sm font-semibold text-slate-200">
                            Nueva contraseña
                        </label>

                        <input type="password" placeholder="••••••••"
                            class="w-full rounded-2xl border border-white/10 bg-white/10 px-5 py-4 text-white placeholder:text-slate-400 outline-none backdrop-blur-xl transition focus:border-sky-400 focus:ring-4 focus:ring-sky-400/20" />

                        <!-- Helper -->
                        <p class="mt-3 text-sm text-slate-400">
                            Usa mínimo 8 caracteres.
                        </p>

                    </div>

                    <!-- Confirm Password -->
                    <div>

                        <label class="mb-3 block text-sm font-semibold text-slate-200">
                            Confirmar contraseña
                        </label>

                        <input type="password" placeholder="••••••••"
                            class="w-full rounded-2xl border border-white/10 bg-white/10 px-5 py-4 text-white placeholder:text-slate-400 outline-none backdrop-blur-xl transition focus:border-sky-400 focus:ring-4 focus:ring-sky-400/20" />

                    </div>

                    <!-- Password Strength -->
                    <div>

                        <div class="mb-3 flex items-center justify-between">

                            <span class="text-sm font-medium text-slate-300">
                                Seguridad
                            </span>

                            <span class="text-sm font-bold text-emerald-300">
                                Fuerte
                            </span>

                        </div>

                        <!-- Progress -->
                        <div class="h-3 overflow-hidden rounded-full bg-white/10">

                            <div class="h-full w-[85%] rounded-full bg-linear-to-r from-emerald-400 to-green-300"></div>

                        </div>

                    </div>

                    <!-- BUTTON -->
                    <button type="submit"
                        class="group w-full rounded-2xl bg-linear-to-r from-sky-500 via-cyan-400 to-violet-500 px-6 py-4 text-lg font-bold text-white shadow-2xl shadow-sky-500/30 transition duration-300 hover:scale-[1.02]">

                        <span class="flex items-center justify-center">

                            Actualizar contraseña

                            <span class="ml-3 transition group-hover:translate-x-1">
                                →
                            </span>

                        </span>

                    </button>

                </form>

                <!-- Divider -->
                <div class="my-8 flex items-center gap-4">

                    <div class="h-px flex-1 bg-white/10"></div>

                    <span class="text-sm text-slate-400">
                        navegación
                    </span>

                    <div class="h-px flex-1 bg-white/10"></div>

                </div>

                <!-- ACTIONS -->
                <div class="flex flex-col gap-4 sm:flex-row">

                    <!-- Back -->
                    <a href="#login"
                        class="inline-flex items-center justify-center rounded-2xl border border-white/10 bg-white/5 px-6 py-4 text-base font-semibold text-white backdrop-blur-xl transition hover:bg-white/10">

                        ← Volver al login

                    </a>

                    <!-- Forgot -->
                    <a href="#forgot"
                        class="inline-flex items-center justify-center rounded-2xl border border-sky-400/20 bg-sky-500/10 px-6 py-4 text-base font-semibold text-sky-300 transition hover:bg-sky-500/20 hover:text-white">

                        Recuperar acceso

                    </a>

                </div>

                <!-- Bottom note -->
                <div class="mt-10 text-center">

                    <p class="text-sm leading-relaxed text-slate-400">

                        Por seguridad, utiliza una contraseña diferente
                        a las que hayas usado anteriormente.

                    </p>

                </div>

            </div>

        </div>

    </div>

</main>
