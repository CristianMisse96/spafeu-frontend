<div class="min-h-screen bg-slate-50">

  <!-- OVERLAY MÓVIL -->
  @if (sidebarOpen()) {
    <div
      class="fixed inset-0 z-40 bg-indigo-950/30 backdrop-blur-sm lg:hidden transition-opacity duration-300"
      (click)="closeSidebar()"
      aria-hidden="true">
    </div>
  }

  <div class="flex min-h-screen">

    <!-- SIDEBAR -->
    @if (showSidebar()) {
      <app-dashboard-sidebar
        [expanded]="sidebarExpanded()"
        [mobileOpen]="sidebarOpen()"
        [items]="navItems"
        (toggleExpand)="toggleSidebarExpanded()"
        (closeMobile)="closeSidebar()" />
    }

    <!-- MAIN -->
    <main
      class="flex-1 min-w-0 transition-all duration-300"
      [class.lg:ml-72]="showSidebar() && sidebarExpanded()"
      [class.lg:ml-24]="showSidebar() && !sidebarExpanded()">

      <!-- TOPBAR -->
      @if (showSidebar()) {
        <app-dashboard-topbar
          title="Dashboard"
          [currentDate]="currentDate()"
          [userInitial]="userInitial()"
          [notificationCount]="3"
          (menuToggle)="toggleSidebar()"
          (logout)="logout()" />
      }

      <!-- CONTENT -->
      <div class="p-4 md:p-6 xl:p-8">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
