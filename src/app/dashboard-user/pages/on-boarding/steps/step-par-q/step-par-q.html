<div class="space-y-4">
    @for (q of questions(); track q.id) {
    <div>
        <p class="font-semibold">{{ q.text }}</p>
        <div class="flex gap-4">
            @for (option of q.options; track $index) {
                <p-radioButton [formControlName]="q.id.toString()" 
                               [value]="option.id"></p-radioButton>
                <label>{{option.label}}</label>
            }
        </div>
    </div>
    }
</div>
