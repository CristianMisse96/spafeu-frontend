<header class="sticky top-0 z-30 border-b border-slate-200/60 bg-white/80 backdrop-blur-2xl">
  <div class="flex items-center justify-between gap-4 px-4 py-3 md:px-8">

    <!-- LEFT -->
    <div class="flex items-center gap-3 min-w-0">
      @if (showMenuToggle()) {
        <button
          type="button"
          class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 bg-white shadow-sm transition-all hover:bg-slate-50 hover:shadow-md lg:hidden"
          (click)="menuToggle.emit()"
          aria-label="Abrir menú">
          <i class="pi pi-bars text-slate-700" aria-hidden="true"></i>
        </button>
      }
      <div class="flex flex-col min-w-0">
        @if (currentDate()) {
          <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 truncate">{{ currentDate() }}</span>
        }
        <h1 class="text-lg md:text-xl font-bold tracking-tight text-slate-800 truncate">
          {{ title() }}
        </h1>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="flex items-center gap-2 md:gap-3 shrink-0">
      <div class="hidden md:flex items-center gap-3">
        <p-tag
          severity="warn"
          [value]="objective()"
          class="rounded-full! bg-amber-50! border! border-amber-200! px-3! py-1.5! text-xs! font-semibold! text-amber-700!">
        </p-tag>

        <button
          type="button"
          class="relative flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 bg-white shadow-sm transition-all hover:bg-slate-50"
          aria-label="Notificaciones">
          <i class="pi pi-bell text-slate-600" aria-hidden="true"></i>
          @if (notificationCount() > 0) {
            <span class="absolute -top-1 -right-1 flex h-4 w-4 items-center justify-center rounded-full bg-rose-500 text-[9px] font-bold text-white ring-2 ring-white">{{ notificationCount() }}</span>
          }
        </button>

        <div class="h-8 w-px bg-slate-200"></div>

        <p-avatar
          [label]="userInitial()"
          shape="circle"
          styleClass="!h-9 !w-9 !bg-gradient-to-br !from-indigo-500 !to-indigo-700 !text-white !font-bold !text-sm !shadow-md">
        </p-avatar>
      </div>

      <button
        type="button"
        class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-700 shadow-sm transition-all hover:bg-slate-100 hover:border-slate-300 hover:shadow-md"
        (click)="logout.emit()"
        pTooltip="Cerrar sesión"
        tooltipPosition="bottom"
        aria-label="Cerrar sesión">
        <i class="pi pi-sign-out" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</header>
