<!-- HEADER: SPAFEU (HTML + Tailwind only) -->
<header class="sticky p-5 z-50 border-b border-slate-200 bg-white/80 backdrop-blur">
  <div class="mx-auto max-w-7xl px-4">
    <div class="flex h-16 items-center justify-between gap-3">

      <!-- Brand -->
      <a href="/" class="flex items-center gap-3 rounded-md focus:outline-none focus:ring-2 focus:ring-sky-500">
        <img
          src="/logo.png"
          alt="SPAFEU"
          class="h-12 w-auto shrink-0 object-contain sm:h-14 md:h-16 lg:h-20"
        />
        <div class="leading-tight">
          <div class="text-[11px] text-slate-500 sm:text-xs">Actividad Física Universitaria</div>
        </div>
      </a>

      <!-- Desktop nav -->
      <nav class="hidden md:flex items-center gap-1 text-sm">
        <a href="#inicio" class="rounded-md px-3 py-2 text-slate-700 hover:bg-slate-100 hover:text-slate-900">Inicio</a>
        <a href="#evaluacion" class="rounded-md px-3 py-2 text-slate-700 hover:bg-slate-100 hover:text-slate-900">Evaluación</a>
        <a href="#rutinas" class="rounded-md px-3 py-2 text-slate-700 hover:bg-slate-100 hover:text-slate-900">Rutinas</a>
        <a href="#seguimiento" class="rounded-md px-3 py-2 text-slate-700 hover:bg-slate-100 hover:text-slate-900">Seguimiento</a>
        <a href="#educativo" class="rounded-md px-3 py-2 text-slate-700 hover:bg-slate-100 hover:text-slate-900">Educativo</a>
        <a href="#fisioterapeuta" class="rounded-md px-3 py-2 text-slate-700 hover:bg-slate-100 hover:text-slate-900">Fisioterapeuta</a>
      </nav>

      <!-- Desktop actions -->
      <div class="hidden sm:flex items-center gap-2">
        <a
          href="#login"
          class="inline-flex items-center justify-center rounded-lg border border-slate-300 px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-sky-500"
        >
          Ingresar
        </a>
        <a
          href="#registro"
          class="inline-flex items-center justify-center rounded-lg bg-sky-600 px-3 py-2 text-sm font-semibold text-white hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-500"
        >
          Registrarse
        </a>
      </div>

      <!-- Mobile menu toggle (no JS) -->
      <div class="md:hidden">
        <input id="spafeu-nav" type="checkbox" class="peer hidden" />

        <label
          for="spafeu-nav"
          class="inline-flex items-center justify-center rounded-lg border border-slate-300 p-2 text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-sky-500"
          aria-label="Abrir menú"
        >
          <!-- Hamburger icon -->
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </label>

        <!-- Mobile dropdown -->
        <div class="absolute left-0 right-0 top-16 hidden border-b border-slate-200 bg-white shadow-sm peer-checked:block">
          <div class="mx-auto max-w-7xl px-4 py-3">
            <nav class="grid gap-1 text-sm">
              <a href="#inicio" class="rounded-md px-3 py-2 text-slate-700 hover:bg-slate-100">Inicio</a>
              <a href="#evaluacion" class="rounded-md px-3 py-2 text-slate-700 hover:bg-slate-100">Evaluación inicial</a>
              <a href="#rutinas" class="rounded-md px-3 py-2 text-slate-700 hover:bg-slate-100">Rutinas</a>
              <a href="#seguimiento" class="rounded-md px-3 py-2 text-slate-700 hover:bg-slate-100">Seguimiento</a>
              <a href="#educativo" class="rounded-md px-3 py-2 text-slate-700 hover:bg-slate-100">Educativo</a>
              <a href="#fisioterapeuta" class="rounded-md px-3 py-2 text-slate-700 hover:bg-slate-100">Gestión fisioterapeuta</a>

              <div class="my-2 h-px bg-slate-200"></div>

              <div class="grid grid-cols-2 gap-2">
                <a href="#login" class="rounded-lg border border-slate-300 px-3 py-2 text-center font-medium text-slate-700 hover:bg-slate-50">Ingresar</a>
                <a href="#registro" class="rounded-lg bg-sky-600 px-3 py-2 text-center font-semibold text-white hover:bg-sky-700">Registrarse</a>
              </div>
            </nav>
          </div>
        </div>
      </div>

    </div>
  </div>
</header>
