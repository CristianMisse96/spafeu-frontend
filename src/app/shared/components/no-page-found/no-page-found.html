<main class="flex min-h-screen items-center justify-center bg-slate-50 px-4 py-12" role="main" aria-label="Página no encontrada">
  <div class="flex w-full max-w-lg flex-col items-center text-center">
    <!-- Icono -->
    <div
      class="flex h-20 w-20 items-center justify-center rounded-2xl bg-linear-to-br from-indigo-500 to-indigo-700 shadow-xl shadow-indigo-500/30 md:h-24 md:w-24">
      <i class="pi pi-search text-3xl text-white md:text-4xl" aria-hidden="true"></i>
    </div>

    <!-- Código 404 -->
    <h1
      class="mt-8 text-7xl font-extrabold tracking-tighter text-transparent bg-clip-text bg-linear-to-br from-indigo-600 to-amber-500 md:text-9xl"
      aria-label="Error 404">
      404
    </h1>

    <!-- Título -->
    <h2 class="mt-4 text-2xl font-bold tracking-tight text-slate-800 md:text-3xl">
      Página no encontrada
    </h2>

    <!-- Descripción -->
    <p class="mt-3 max-w-md text-base leading-relaxed text-slate-500 md:text-lg">
      Lo sentimos, no pudimos encontrar la página que buscas. Es posible que haya sido movida o que la dirección no
      exista.
    </p>

    <!-- Acciones -->
    <div class="mt-8 flex flex-col gap-3 sm:flex-row">
      <a
        routerLink="/"
        class="inline-flex items-center justify-center gap-2 rounded-xl bg-linear-to-r from-indigo-600 to-indigo-700 px-6 py-3 text-sm font-semibold text-white shadow-lg shadow-indigo-600/20 transition-all duration-300 hover:shadow-xl hover:from-indigo-700 hover:to-indigo-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
        <i class="pi pi-home" aria-hidden="true"></i>
        Volver al inicio
      </a>

      <button
        (click)="goBack()"
        class="inline-flex items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-6 py-3 text-sm font-semibold text-slate-700 shadow-sm transition-all duration-300 hover:bg-slate-50 hover:border-slate-300 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-2">
        <i class="pi pi-arrow-left" aria-hidden="true"></i>
        Ir atrás
      </button>
    </div>
  </div>
</main>
